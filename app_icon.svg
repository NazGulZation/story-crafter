<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%" fx="40%" fy="25%">
      <stop offset="0%" stop-color="#232a36" />
      <stop offset="60%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0a0c10" />
    </radialGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a5a1e" />
    </linearGradient>

    <linearGradient id="goldFeather" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="35%" stop-color="#e5be5a" />
      <stop offset="70%" stop-color="#c69532" />
      <stop offset="100%" stop-color="#8c581a" />
    </linearGradient>

    <!-- Page Gradients -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d6c3" />
      <stop offset="85%" stop-color="#fdfbf5" />
      <stop offset="100%" stop-color="#c9beaa" />
    </linearGradient>

    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9beaa" />
      <stop offset="15%" stop-color="#fdfbf5" />
      <stop offset="100%" stop-color="#e0d6c3" />
    </linearGradient>

    <!-- Cover Edge Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#943b2a" />
      <stop offset="100%" stop-color="#4a180f" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" ry="96" fill="none" stroke="rgba(255, 213, 107, 0.15)" stroke-width="1.5" />

  <!-- The Open Hardcover Base -->
  <g filter="url(#dropShadow)">
    <!-- Leather / Book Backing Spine -->
    <path d="M 86 352 Q 256 388 426 352 L 426 372 Q 256 410 86 372 Z" fill="url(#coverGrad)" />
    <!-- Golden edge leaf trim -->
    <path d="M 88 344 Q 256 380 424 344 L 424 354 Q 256 392 88 354 Z" fill="url(#goldBorder)" opacity="0.85" />
  </g>

  <!-- Open Book Pages -->
  <g filter="url(#dropShadow)">
    <!-- Left Page Block -->
    <path d="M 256 350 C 210 338 135 320 98 334 C 94 250 94 220 96 172 C 140 162 216 178 256 195 Z" fill="url(#pageLeftGrad)" stroke="#c4b8a2" stroke-width="1" />

    <!-- Left Inner Page Layer (Depth) -->
    <path d="M 256 345 C 212 334 140 318 104 330 C 102 260 102 230 104 180 C 144 170 216 186 256 200 Z" fill="#fcf9f2" />

    <!-- Right Page Block -->
    <path d="M 256 350 C 302 338 377 320 414 334 C 418 250 418 220 416 172 C 372 162 296 178 256 195 Z" fill="url(#pageRightGrad)" stroke="#c4b8a2" stroke-width="1" />

    <!-- Right Inner Page Layer (Depth) -->
    <path d="M 256 345 C 300 334 372 318 408 330 C 410 260 410 230 408 180 C 368 170 296 186 256 200 Z" fill="#fcf9f2" />

    <!-- Center Book Crease / Spine Shadow -->
    <path d="M 254 195 Q 256 270 254 352 Q 258 270 258 195 Z" fill="#7a6c58" opacity="0.6" />
  </g>

  <!-- Faint Elegant Typography Lines on Pages -->
  <g stroke="#9e917d" stroke-width="2.5" stroke-linecap="round" opacity="0.45">
    <!-- Left Page Lines -->
    <line x1="130" y1="216" x2="228" y2="224" />
    <line x1="126" y1="238" x2="232" y2="246" />
    <line x1="124" y1="260" x2="230" y2="268" />
    <line x1="122" y1="282" x2="228" y2="290" />
    <line x1="124" y1="304" x2="190" y2="310" />

    <!-- Right Page Lines -->
    <line x1="284" y1="224" x2="382" y2="216" />
    <line x1="280" y1="246" x2="386" y2="238" />
    <line x1="282" y1="268" x2="388" y2="260" />
    <line x1="284" y1="290" x2="390" y2="282" />
    <line x1="284" y1="310" x2="348" y2="304" />
  </g>

  <!-- Crimson Ribbon Marker -->
  <path d="M 256 200 Q 256 290 274 380 L 288 376 L 270 340 Q 262 270 260 200 Z" fill="#a83220" opacity="0.9" />

  <!-- Sleek Golden Mockingbird Feather Quill -->
  <g filter="url(#dropShadow)">
    <!-- Main Quill Shaft / Spine -->
    <path d="M 256 345 Q 296 230 354 100 Q 320 180 256 345 Z" fill="url(#goldFeather)" />

    <!-- Left Vane / Feather Barbs -->
    <path d="M 354 100 Q 315 125 285 180 C 270 210 260 250 256 345 C 265 295 285 240 315 190 Q 338 145 354 100 Z" fill="url(#goldFeather)" opacity="0.95" />

    <!-- Feather Notches (Left Side) -->
    <path d="M 322 152 L 310 162 M 296 195 L 282 208 M 276 240 L 266 250" stroke="#ffd56b" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Right Vane / Feather Barbs -->
    <path d="M 354 100 Q 365 145 360 190 C 354 235 330 275 290 320 C 320 270 338 230 342 185 Q 346 140 354 100 Z" fill="#e5be5a" opacity="0.85" />

    <!-- Gold Quill Nib -->
    <path d="M 256 345 L 252 355 L 256 368 L 260 355 Z" fill="#ffd56b" stroke="#aa771c" stroke-width="1" />
    <!-- Ink slit in nib -->
    <line x1="256" y1="352" x2="256" y2="365" stroke="#4a180f" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Subtle Spark of Light / Ink Droplet on Page -->
  <circle cx="256" cy="372" r="3.5" fill="#ffd56b" />
  <circle cx="256" cy="372" r="7" fill="none" stroke="#ffd56b" stroke-width="1.2" opacity="0.6" />

  <!-- Little Golden Stars / Sparks around the Quill -->
  <g fill="#ffe699" opacity="0.75">
    <path d="M 374 86 Q 376 96 384 98 Q 376 100 374 110 Q 372 100 364 98 Q 372 96 374 86 Z" />
    <path d="M 330 70 Q 331 77 337 78 Q 331 80 330 86 Q 329 80 323 78 Q 329 77 330 70 Z" />
    <circle cx="396" cy="120" r="2.5" />
    <circle cx="310" cy="90" r="2" />
  </g>
</svg>
